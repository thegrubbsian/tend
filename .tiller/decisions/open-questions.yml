questions:
    - id: Q-lfe6in
      statement: How should weekly quantity habits scope logging and set-total behavior when their bucket is a week but the log sheet specifies Today and Yesterday?
      owner: jc
      blocks:
        - F-z8e13q
      status: answered
      answer: 'Quantity-habit logging is scoped to the selected bucket. Daily habits use Today and Yesterday; weekly habits use This Week and Last Week. Last Week is available only on Monday while the weekly grace bucket remains editable and is marked when unfinished. Progress, quick-add, custom entry, logged entries, deletion, and back-fill all operate on the selected bucket. Set Total is cadence-aware: Set day total for daily habits and Set week total for weekly habits. It appends the positive difference between the entered total and the selected bucket''s current sum; an equal total is a no-op, and lowering a total requires deleting incorrect entries first. Weekly habits do not introduce daily sub-buckets.'
      answer_revision:
        kind: sha256
        value: sha256:c8ccdf9aa8294581c86804a53dbcdf66041770a3d377eb886b2585613c69bacf
        observed_at: 2026-08-01T08:05:56.653564Z
      source: design/03-user-experience.md
    - id: Q-zyqw93
      statement: What weekly Habit Detail history layout, navigation, and state treatment should replace the day-cell garden bed specified for daily habits?
      owner: jc
      blocks:
        - F-efgzky
      status: answered
      answer: Weekly Habit Detail uses a vertical rolling 13-week history with one row per Monday-Sunday bucket, newest first. The header shows the window's date range, and previous and next chevrons move by 13-week windows. Each row shows its week range, aggregate progress with unit, and bucket state; tapping exposes the full range, state, aggregate, and applicable requirement snapshot. Final met uses moss, final missed uses withered, the current week uses a clay outline, and the grace week uses an ochre outline and at-risk treatment when unmet. Provisionally met current or grace weeks retain moss fill with the corresponding outline. Inactive and pre-creation weeks use the existing sunken ghost treatment. Weekly history never renders seven day cells or implies daily verdicts. VoiceOver announces the week range, progress, state, finality, and risk.
      answer_revision:
        kind: sha256
        value: sha256:d00b26ed6ac888fda14793a73ca35fadda0c7d915d0c1ae06691f916831f7ca3
        observed_at: 2026-08-01T08:31:22.269453Z
      source: design/05-visual-design.md
    - id: Q-c1ostz
      statement: When a habit is deactivated and reactivated within the same calendar bucket, are the exempted bucket and its existing entries restored, discarded, or replaced?
      owner: jc
      blocks:
        - F-aotv97
      status: answered
      answer: Deactivation never deletes log entries. If a habit is reactivated within the same current calendar bucket, that bucket is restored and its existing entries count toward the current requirement. Non-current buckets exempted at deactivation, including a grace bucket, remain permanently exempt. Reactivation in a later interval begins only that interval's current bucket. Tend never creates multiple buckets for the same habit and calendar interval.
      answer_revision:
        kind: sha256
        value: sha256:b1b656336d5c54492098b057d3e918af28ff1f3d49237f1b7d2311f1fac82b89
